name: Create Draft Release

on:
  push:
    tags:
      - 'v*'

jobs:
  check_metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check releaseSeries in metadata.yaml
        run: make check-metadata RELEASE_TAG="${GITHUB_REF_NAME}"

  draft_release:
    needs: check_metadata
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Create Release Artifacts
        run: make release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/ipam-infoblox/${{ github.ref_name }}/*.*

  extract-meta:
    needs: check_metadata
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      ldflags: ${{ steps.version_info.outputs.LDFLAGS }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/telekom/cluster-api-ipam-provider-infoblox
      - id: version_info
        run: echo "LDFLAGS=$(hack/version.sh)" >> $GITHUB_OUTPUT

  release_image:
    permissions:
      packages: write
    needs: extract-meta
    uses: ./.github/workflows/build-image.yaml
    with:
      image_tags: ${{ needs.extract-meta.outputs.tags }}
      labels: ${{ needs.extract-meta.outputs.labels }}
      build_args: |
        ldflags=${{ needs.extract-meta.outputs.ldflags }}
